<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Commit Pet — EN examples</title>
<style>
  body { background:#0b0e14; color:#e8edff; font-family:'Segoe UI',sans-serif; margin:0; padding:32px; }
  h1 { font-size:20px; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; }
  .item { background:#11151f; border:1px solid #232a3a; border-radius:12px; padding:12px; }
  .item img { display:block; width:480px; height:200px; }
  .cap { color:#8a96b8; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>Commit Pet — EN theme</h1>
<div class="grid">
  <div class="item"><img src="en-slime.svg" alt="slime"><div class="cap">slime / happy</div></div>
  <div class="item"><img src="en-cat.svg" alt="cat"><div class="cap">cat / hungry</div></div>
  <div class="item"><img src="en-ghost.svg" alt="ghost"><div class="cap">ghost / sick</div></div>
</div>
</body>
</html>
