<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Commit Pet — examples</title>
<style>
  body { background:#0b0e14; color:#e8edff; font-family:'Segoe UI',sans-serif; margin:0; padding:32px; }
  h1 { font-size:20px; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; }
  .item { background:#11151f; border:1px solid #232a3a; border-radius:12px; padding:12px; }
  .item img { display:block; width:480px; height:200px; image-rendering:auto; }
  .cap { color:#8a96b8; font-size:12px; margin-top:8px; }
</style>
</head>
<body>
<h1>Commit Pet — examples</h1>
<div class="grid">
  <div class="item"><img src="slime.svg" alt="slime"><div class="cap">slime / hungry</div></div>
  <div class="item"><img src="cat.svg" alt="cat"><div class="cap">cat / happy</div></div>
  <div class="item"><img src="ghost.svg" alt="ghost"><div class="cap">ghost / sick</div></div>
  <div class="item"><img src="hungry.svg" alt="hungry"><div class="cap">slime / idle 4d</div></div>
  <div class="item"><img src="sick.svg" alt="sick"><div class="cap">slime / idle 8d</div></div>
</div>
</body>
</html>
