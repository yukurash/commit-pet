<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192" shape-rendering="crispEdges" role="img" aria-label="pixel ghost">
  <rect x="66" y="158" width="60" height="9" fill="#000" opacity="0.12">
    <animate attributeName="width" values="60;48;60" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="x" values="66;72;66" dur="2.6s" repeatCount="indefinite"/>
  </rect>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="2.6s"
       repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" keyTimes="0;0.5;1"/>
    <!-- body -->
    <g fill="#eaf0ff">
      <rect x="72" y="36" width="48" height="12"/>
      <rect x="60" y="48" width="72" height="12"/>
      <rect x="60" y="60" width="72" height="12"/>
      <rect x="60" y="72" width="72" height="12"/>
      <rect x="60" y="84" width="72" height="12"/>
      <rect x="60" y="96" width="72" height="12"/>
      <rect x="60" y="108" width="72" height="12"/>
    </g>
    <!-- wavy feet -->
    <g fill="#eaf0ff">
      <rect x="60" y="120" width="12" height="12"/>
      <rect x="84" y="120" width="12" height="12"/>
      <rect x="108" y="120" width="12" height="12"/>
    </g>
    <!-- soft shade -->
    <rect x="120" y="60" width="12" height="60" fill="#cdd8f5"/>
    <!-- eyes -->
    <g fill="#2a2f45">
      <rect x="72" y="60" width="12" height="24">
        <animate attributeName="height" values="24;24;24;6;24;24" keyTimes="0;0.8;0.86;0.9;0.95;1" dur="4.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="108" y="60" width="12" height="24">
        <animate attributeName="height" values="24;24;24;6;24;24" keyTimes="0;0.8;0.86;0.9;0.95;1" dur="4.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- blush -->
    <rect x="60" y="84" width="12" height="12" fill="#ffb3c7"/>
    <rect x="120" y="84" width="12" height="12" fill="#ffb3c7"/>
    <!-- mouth -->
    <rect x="90" y="84" width="12" height="12" fill="#2a2f45"/>
  </g>
</svg>
